<header class="header" th:fragment="header">
	<div class="header-container">
		<div class="header-logo">
			<a th:href="@{/posts/index}">
				<img class="header-logo__img" th:src="@{/images/atlas.png}" alt="ロゴ">
			</a>
		</div>

		<div class="header-info">
			<div>
				<span class="profile-info"><a href="/users/myProfile">[[${@account.name}]]</a>　さん</span>
			</div>

			<div th:replace="~{fragments/accordion :: accordion}"></div>

			<div class="profile-icon">
				<a th:href="@{/users/myProfile}">
					<img class="profile-icon__img" th:src="${@account.iconImage}" alt="プロフィール画像" />
				</a>
			</div>
		</div>
	</div>
	<!-- 共通メッセージ表示 -->
	<div class="message-container">
		<div th:if="${error != null}">
			<div class="message-box error">
				<p th:text="${error}"></p>
			</div>
		</div>

		<div th:if="${info != null}">
			<div class="message-box info">
				<p th:text="${info}"></p>
			</div>
		</div>
	</div>
</header>
