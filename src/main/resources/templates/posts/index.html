<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>TOP</title>
	<link rel="stylesheet" th:href="@{/css/reset.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/modal.css}">
	<link rel="stylesheet" th:href="@{/css/button.css}">
	<link rel="stylesheet" th:href="@{/css/messages.css}">
</head>

<body>

	<!-- ヘッダーテンプレートの読み込み -->
	<header th:replace="~{fragments/header :: header}"></header>

	<main class="main-container">

		<!-- 新規投稿 -->
		<form action="/posts/createPost" method="post" th:object="${post}">
			<div class="main-header">
				<div class="profile-icon">
					<a th:href="@{/users/myProfile}">
						<img class="profile-icon__img" th:src="${@account.iconImage}" alt="プロフィール画像" />
					</a>
				</div>
				<div th:if="${#fields.hasErrors('content')}" th:errors="${post.content}"></div>
				<textarea class="create-post__textarea" th:field="${post.content}" cols="50" rows="5"
					placeholder="投稿内容を入力してください。" required maxlength="150"></textarea>
				<div class="post-button-container">
					<button class="send-icon" type="submit"></button>
				</div>
			</div>
		</form>

		<!-- 投稿一覧 -->
		<div class="list-container">
			<div th:each="post:${postList}">

				<div class="list-container__item">
					<!-- ログインユーザー自身の場合の画像 -->
					<a th:if="${post.user.id == loginUser.id}" th:href="@{/users/myProfile}">
						<img class="profile-icon__img" th:src="@{${post.user.iconImage}}" alt="プロフィール画像">
					</a>

					<!-- 他のユーザーの場合の画像 -->
					<a th:if="${post.user.id != loginUser.id}"
						th:href="@{/users/{userId}/profile(userId=${post.user.id})}">
						<img class="profile-icon__img" th:src="@{${post.user.iconImage}}" alt="プロフィール画像">
					</a>

					<div class="list-container__item-body">
						<div class="list-container__user-name" th:text="${post.user.name}"></div>
						<div class="list-container__post-content" th:utext="${post.content}"></div>
					</div>

					<div class="list-container__item-meta">
						<div class="list-container__updateAt" th:text="${post.updatedAt}"></div>
						<th:block th:if="${@account.id} == ${post.user.id}">
							<div class="list-container__action">
								<!-- 投稿更新ボタン -->
								<button class="edit-icon edit-modal-open" th:data-id="${post.id}"
									th:data-content="${post.content}" type="button"></button>

								<!-- 投稿削除ボタン -->
								<button class="delete-icon delete-modal-open" th:data-id="${post.id}"
									th:data-content="${post.content}" type="button"></button>
							</div>
						</th:block>
					</div>
				</div>
			</div>
		</div>
	</main>

	<!-- サイドバーテンプレートの読み込み -->
	<div th:replace="~{fragments/sidebar :: sidebar}"></div>

	<!-- モーダルテンプレートの読み込み -->
	<div th:replace="~{fragments/editModal :: editModal}"></div>
	<div th:replace="~{fragments/deleteModal :: deleteModal}"></div>

	<!-- JSファイルの読み込み -->
	<script th:src="@{/js/postModal.js}"></script>
	<script th:src="@{/js/accordion.js}"></script>

</body>

</html>
