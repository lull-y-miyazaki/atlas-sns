<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
</head>

<body>

	<div th:if="${success != null}" th:text="${success}"></div>

	<div>
		<form action="/posts/createPost" method="post" th:object="${post}">
			<div th:if="${#fields.hasErrors('content')}" th:errors="${post.content}"></div>
			<textarea th:field="${post.content}" cols="50" rows="5" placeholder="投稿内容を入力してください。" required></textarea>
			<button type="submit">送信</button>
		</form>
	</div>

	<div th:each="post:${postList}">
		<div th:text="${post.content}"></div>
		<div th:text="${post.updatedAt}"></div>
		<form action="">
			<button>更新</button>
		</form>
		<form th:action="@{/posts/{postId}/delete(postId=${post.id})}" method="post">
			<button>削除</button>
		</form>
	</div>

</body>

</html>
