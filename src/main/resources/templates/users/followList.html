<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>フォロー情報一覧</title>
	<link rel="stylesheet" th:href="@{/css/reset.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/button.css}">
	<link rel="stylesheet" th:href="@{/css/messages.css}">
</head>

<body>

	<!-- ヘッダーテンプレートの読み込み -->
	<header th:replace="~{fragments/header :: header}"></header>

	<main class="main-container">

		<div class="main-header">
			<h2 th:text="${listType == 'followings'} ? 'フォローリスト' : 'フォロワーリスト'"></h2>

			<div class="user-icon-list">
				<div th:each="user : ${userList}">
					<a th:if="${user.id != loginUser.id}" th:href="@{/users/{userId}/profile(userId=${user.id})}">
						<img class="profile-icon__img" th:src="@{${user.iconImage}}" alt="プロフィール画像">
					</a>
				</div>
			</div>
		</div>

		<div class="list-container">
			<div th:each="post:${postList}">

				<div class="list-container__item">
					<!-- 他のユーザーの場合の画像 -->
					<a th:if="${post.user.id != loginUser.id}"
						th:href="@{/users/{userId}/profile(userId=${post.user.id})}">
						<img class="profile-icon__img" th:src="@{${post.user.iconImage}}" alt="プロフィール画像">
					</a>

					<div class="list-container__item-body">
						<div class="list-container__user-name" th:text="${post.user.name}"></div>
						<div class="list-container__post-content" th:utext="${post.content}"></div>
					</div>

					<div class="list-container__item-meta">
						<div class="list-container__updateAt" th:text="${post.updatedAt}"></div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<!-- サイドバーテンプレートの読み込み -->
	<div th:replace="~{fragments/sidebar :: sidebar}"></div>

	<!-- JSファイルの読み込み -->
	<script th:src="@{/js/accordion.js}"></script>

</body>

</html>
